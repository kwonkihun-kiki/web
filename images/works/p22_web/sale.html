<title>IAM Shop Sale</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #preview-badge {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 10;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    pointer-events: none;
  }
</style>

<canvas id="iamCouponCanvas"></canvas>
<div id="preview-badge">Preview · IAM Shop</div>

<script>
(function () {
  var C = document.getElementById('iamCouponCanvas');
  var ctx = C.getContext('2d');

  var BRANDS5 = ['AURALEE', 'MM6', 'KOLOR', 'CAMIEL FORTGENS', 'DANTON'];
  var ALL = [
    'AURALEE','MM6','KOLOR','CAMIEL FORTGENS','DANTON','AUTRY','BRAIN DEAD',
    'PETERSON STOOP','SOUTH2 WEST8','CASEY CASEY','VANS','PUMA','ADIDAS',
    'BOWWOW','KOOKY ZOO','SKEWED','MAGLIANO','NNORMAL','SCYE','CLARKS',
    'RINEN','J PRESS','ANACHRONORM','T-BY BIRTHDAYSUIT','KOLOR / BEACON',
    'ENGINEERED GARMENTS','BE ABLE','RIDING HIGH','2000 ARCHIVES','HAULIER',
    'SALOMON','NORDA','JW ANDERSON','ARIES','HED MAYNER','SUNFLOWER',
    'SEVEN BY SEVEN','GO GETTER','CONNIE COSTAS'
  ];
  var RED_WORDS = ['UP TO 70%', '7.29–8.2'];

  var W, H, FS, LH, TOP_H, BG_FONT, BRAND_RATIO, ROWS, TOTAL_H;

  function isMobile() { return window.innerWidth < 768; }

  function setup() {
    W = C.width  = window.innerWidth;
    H = C.height = window.innerHeight;
    if (isMobile()) {
      FS = 9;  LH = 15; BRAND_RATIO = 0.13;
    } else {
      FS = 13; LH = 21; BRAND_RATIO = 0.20;
    }
    TOP_H   = Math.round(LH * 2);
    BG_FONT = '400 ' + FS + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    buildRows();
  }

  function buildRows() {
    var mc = document.createElement('canvas').getContext('2d');
    mc.font = BG_FONT;
    var ROW_COUNT = Math.ceil(H / LH) * 3 + 6;
    ROWS = []; TOTAL_H = ROW_COUNT * LH;
    var wi = 0, redSeq = 0;
    for (var r = 0; r < ROW_COUNT; r++) {
      var row = [], x = 0;
      var rowRedOffset = (r % 4 === 0) ? Math.floor((r * 3 + 5) % 18) : -1;
      var wordsInRow = 0;
      while (x < W + 100) {
        var isRed = (rowRedOffset >= 0 && wordsInRow === rowRedOffset && wordsInRow > 0);
        var txt, col;
        if (isRed) { txt = RED_WORDS[redSeq % 2]; redSeq++; col = '#e74c3c'; }
        else       { txt = ALL[wi % ALL.length]; wi++; col = '#444'; }
        var tw = mc.measureText(txt).width;
        row.push({ t: txt, col: col, x: x });
        x += tw + mc.measureText('  ').width;
        wordsInRow++;
      }
      ROWS.push(row);
    }
  }

  setup();
  window.addEventListener('resize', function () { setup(); });

  function getBrandFS(brand) {
    var fs = Math.min(Math.floor(H * BRAND_RATIO), 200);
    var tmp = document.createElement('canvas').getContext('2d');
    tmp.font = '700 ' + fs + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    while (tmp.measureText(brand).width > W * 0.85 && fs > 24) {
      fs--; tmp.font = '700 ' + fs + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    }
    return fs;
  }

  var offsetY = 0;
  function drawRows(tctx, colOverride) {
    tctx.font = BG_FONT;
    tctx.textBaseline = 'alphabetic';
    tctx.textAlign = 'left';
    for (var r = 0; r < ROWS.length; r++) {
      var by = ((r * LH - offsetY) % TOTAL_H + TOTAL_H) % TOTAL_H - LH;
      if (by < TOP_H - LH || by > H + LH) continue;
      var row = ROWS[r];
      for (var i = 0; i < row.length; i++) {
        tctx.fillStyle = colOverride || row[i].col;
        tctx.fillText(row[i].t, row[i].x, by);
      }
    }
  }

  var curB = 0, alpha = 0, phase = 'in', t0 = performance.now();
  var T_IN = 700, T_HOLD = 1800, T_OUT = 600, SPEED = 0.6;

  function render(ts) {
    requestAnimationFrame(render);
    var el = ts - t0;
    if      (phase === 'in'   && el > T_IN)   { phase = 'hold'; t0 = ts; el = 0; }
    else if (phase === 'hold' && el > T_HOLD)  { phase = 'out';  t0 = ts; el = 0; }
    else if (phase === 'out'  && el > T_OUT)   { curB = (curB + 1) % BRANDS5.length; phase = 'in'; t0 = ts; el = 0; }

    alpha = phase === 'in'   ? Math.min(1, el / T_IN)
          : phase === 'hold' ? 1
          :                    Math.max(0, 1 - el / T_OUT);

    offsetY = (offsetY + SPEED) % TOTAL_H;

    var brand = BRANDS5[curB];
    var bFS   = getBrandFS(brand);
    var bFont = '700 ' + bFS + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';

    /* 1. Black BG */
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    /* 2. Scrolling rows (clipped below top bar) */
    ctx.save();
    ctx.beginPath(); ctx.rect(0, TOP_H, W, H - TOP_H); ctx.clip();
    drawRows(ctx, null);
    ctx.restore();

    /* 3. Brand name mask: white rows clipped to brand letterforms */
    if (alpha > 0.01) {
      /* white scrolling rows offscreen */
      var offB = document.createElement('canvas'); offB.width = W; offB.height = H;
      var ctxB = offB.getContext('2d');
      ctxB.save(); ctxB.beginPath(); ctxB.rect(0, TOP_H, W, H - TOP_H); ctxB.clip();
      drawRows(ctxB, '#fff');
      ctxB.restore();

      /* mask: brand name filled white */
      var offMask = document.createElement('canvas'); offMask.width = W; offMask.height = H;
      var ctxMask = offMask.getContext('2d');
      ctxMask.clearRect(0, 0, W, H);
      ctxMask.fillStyle = '#fff';
      ctxMask.font = bFont;
      ctxMask.textAlign = 'center';
      ctxMask.textBaseline = 'middle';
      ctxMask.fillText(brand, W / 2, H / 2);

      /* clip white rows to mask */
      ctxB.globalCompositeOperation = 'destination-in';
      ctxB.drawImage(offMask, 0, 0);

      ctx.globalAlpha = alpha;
      ctx.drawImage(offB, 0, 0);
      ctx.globalAlpha = 1;
    }

    /* 4. Top bar */
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, TOP_H);

    ctx.font = '400 ' + FS + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    ctx.fillStyle = '#e74c3c';
    ctx.fillText('UP TO 70%', 16, TOP_H / 2);

    ctx.fillStyle = '#fff';
    ctx.fillText('7.29 – 8.2', 16 + ctx.measureText('UP TO 70%    ').width, TOP_H / 2);
  }

  requestAnimationFrame(render);
})();
</script>
